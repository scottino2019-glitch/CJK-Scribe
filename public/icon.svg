<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Elegant Traditional Border Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.4" />
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Traditional Seal Stamp (印) in Center -->
  <g filter="url(#shadow)">
    <rect x="116" y="116" width="280" height="280" rx="42" fill="url(#sealGrad)" stroke="#fef08a" stroke-width="4" stroke-opacity="0.85" />
    <rect x="126" y="126" width="260" height="260" rx="34" fill="none" stroke="#fef3c7" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- Asian Character: 書 (Script / Scribe) in White Calligraphic Brush Silhouette -->
  <g fill="#ffffff" fill-opacity="0.96">
    <!-- Top Horizontal stroke -->
    <rect x="180" y="165" width="152" height="18" rx="6" />
    
    <!-- Central vertical stroke -->
    <rect x="247" y="165" width="18" height="105" rx="6" />

    <!-- 2nd and 3rd horizontal strokes -->
    <rect x="195" y="198" width="122" height="14" rx="5" />
    <rect x="190" y="228" width="132" height="14" rx="5" />
    <rect x="175" y="258" width="162" height="16" rx="6" />

    <!-- Lower section (Sun / Box 日) -->
    <rect x="196" y="295" width="120" height="74" rx="8" fill="none" stroke="#ffffff" stroke-width="16" />
    <rect x="202" y="326" width="108" height="12" rx="4" />
  </g>

  <!-- Accent Brush Dot in Gold -->
  <circle cx="396" cy="132" r="14" fill="#fbbf24" filter="url(#shadow)" />
</svg>
